name: gpssync

# One-command production stack for the GpsSync backend:
#   db    – SQL Server 2022 (data persisted in a named volume)
#   api   – the ASP.NET Core API (built from ./GpsSync.Api/Dockerfile)
#   caddy – reverse proxy that terminates HTTPS with an automatic Let's Encrypt cert
#
# Only Caddy is exposed to the internet (80/443). The API and database are reachable
# ONLY inside the compose network — SQL Server is never publicly exposed.
#
# Copy .env.example -> .env and fill in the three values before `docker compose up`.

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in server/.env}
      MSSQL_PID: Developer
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      # API waits until this passes, so migrations never race a cold database.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./GpsSync.Api
    environment:
      # Connects to the db service over the internal network (host = service name "db").
      ConnectionStrings__Default: "Server=db,1433;Database=GpsSync;User Id=sa;Password=${SA_PASSWORD:?};TrustServerCertificate=True;Encrypt=False"
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in server/.env}
      ASPNETCORE_URLS: "http://+:5080"
      # ---- Optional: real password-reset emails (otherwise codes are written to the API log) ----
      # Email__Mode: "Smtp"
      # Email__Host: "smtp.yourprovider.com"
      # Email__Port: "587"
      # Email__User: "apikey-or-username"
      # Email__Password: "smtp-password"
      # Email__From: "dispatch@yourcompany.com"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"     # required for the Let's Encrypt HTTP challenge + redirect to HTTPS
      - "443:443"   # HTTPS the phones talk to
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in server/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # persists issued certs across restarts
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  mssql_data:
  caddy_data:
  caddy_config:
